name: validate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-ioc-data:
    name: Validate ioc-data/*.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pyyaml jsonschema
      - name: Validate every ioc-data file
        run: |
          for f in ioc-data/*.yml; do
            python3 validation/validate-ioc-data.py "$f"
          done

  validate-feed-state:
    name: Validate feed-state.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pyyaml jsonschema
      - name: Validate feed-state.json
        run: python3 validation/validate-feed-state.py

  validate-rules:
    name: Validate rules/**/*.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pyyaml jsonschema
      - name: Validate every rule
        run: |
          find accessibility_audit app_scanner appops_audit battery_daily correlation db_info \
               device_auditor dns_monitor file_scanner package_install_history platform_compat \
               receiver_audit staging timeline tombstone_parser wakelock_parser \
               -name '*.yml' -print0 \
            | xargs -0 -I{} python3 validation/validate-rule.py "{}"
      - name: No rule directory escapes the sweep
        # A new top-level dir holding rule YAML that is missing from the find
        # list above would be silently unvalidated — the same drift class this
        # repo's gates exist to kill. Non-rule dirs are the stable denylist.
        run: |
          swept="accessibility_audit app_scanner appops_audit battery_daily correlation db_info \
                 device_auditor dns_monitor file_scanner package_install_history platform_compat \
                 receiver_audit staging timeline tombstone_parser wakelock_parser"
          nonrule="validation ioc-data decisions pipeline-runs docs"
          bad=0
          for d in */; do
            d=${d%/}
            ls "$d"/*.yml "$d"/*/*.yml >/dev/null 2>&1 || continue
            case " $swept $nonrule " in
              *" $d "*) ;;
              *) echo "::error::directory '$d' contains .yml files but is neither swept by validate-rules nor a known non-rule dir — add it to one list"; bad=1 ;;
            esac
          done
          exit $bad

  validate-manifest:
    name: Validate rules.sha256 manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        # The gate imports validate-rule.py for the shared NON_DELIVERABLE_DIRS
        # constant, and that module imports yaml at load time.
        run: pip install pyyaml
      - name: Delivery-set gate (containment, uniqueness, id↔filename)
        # rules.txt is the security boundary devices actually fetch. This
        # gate rejects correlation/ and staging/ paths (cataloged, never
        # deliverable), basename/id collisions (on-device merge is last-wins
        # by id), and id↔filename mismatches (the shadowing vector).
        run: python3 validation/validate-delivery-set.py
      - name: rules.txt and rules.sha256 must list the same files
        run: |
          diff <(awk '{print $2}' rules.sha256 | sort) \
               <(grep '\.yml' rules.txt | sed 's/[[:space:]]*$//' | sort) \
            || { echo "::error::rules.txt and rules.sha256 list different files"; exit 1; }
      - name: rules.sha256 hashes must match rule content
        # The app fetches rules.txt + rules.sha256 and SKIPS any rule whose
        # content hash does not match the manifest. A rule edited without
        # regenerating rules.sha256 is therefore silently dropped on-device.
        # This gate fails the PR so the manifest can never drift again.
        run: |
          sha256sum -c rules.sha256 --strict --quiet \
            || { echo "::error::rules.sha256 is out of sync with rule content. Regenerate: while read -r f; do printf '%s  %s\n' \"\$(sha256sum \"\$f\" | cut -d' ' -f1)\" \"\$f\"; done < rules.txt > rules.sha256"; exit 1; }

  validate-complementarity-changed:
    name: Complementarity (strict on changed files)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pyyaml
      - name: Identify changed ioc-data files
        id: changed
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'ioc-data/*.yml' | tr '\n' ' ')
          echo "files=$CHANGED" >> "$GITHUB_OUTPUT"
      - name: Strict check on changed files
        if: steps.changed.outputs.files != ''
        run: |
          for f in ${{ steps.changed.outputs.files }}; do
            python3 validation/validate-ioc-complementarity.py --file "$f" --mode strict
          done

  validate-complementarity-all-advisory:
    name: Complementarity (advisory on all files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pyyaml
      - name: Advisory check on every file
        run: |
          python3 validation/validate-ioc-complementarity.py --all --mode advisory

  validate-lint-tests:
    name: Validator unit tests
    runs-on: ubuntu-latest
    steps:
      # Actions here are SHA-pinned (same digests AndroDR's ci.yml already
      # vetted). The pre-existing @v4/@v5 tags in this file are left alone --
      # pinning them is AndroDR #336's job, and doing it piecemeal here would
      # obscure this change.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pyyaml jsonschema pytest
      - name: Run validator unit tests
        # The lints are gated per-rule by the sweep above, but nothing ran the
        # tests that prove the lints still behave. Two had been failing on main
        # and a third passing vacuously, unnoticed (#68).
        run: python3 -m pytest validation/ -q
