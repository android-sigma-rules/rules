      sourcing noted for revisit. See decisions/2026-08-22-badbox-admoyu.yml.
    failure_class: severity_judgment
  - id: androdr-095
    verdict: approved_with_modification
    reason: >
      Authored as androdr-294 (shard-stride ID leak; workflow fix AndroDR
      #316) keying on permissions literals the scanner never emitted — a
      dead rule caught at HitL. Re-authored after the emitter-emits-all-facts
      change (AndroDR #317): matchers moved to requested_permissions with
      verbatim FQN exact-equals values; is_sideloaded (judgment field,
      frozen allowlist) replaced by the Phase-2-native negated
      trusted_installer_db exemption (sideload-establishing per the
      implies_flags gate); vestigial known-good filter dropped (unreachable
      behind not store_installed). Ships with #136 Phase 2; coverage bound
      (API 33+ NEARBY_WIFI_DEVICES term) recorded in the rule.
    failure_class: other
