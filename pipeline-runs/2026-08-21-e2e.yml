notes: >
  First e2e-workflow run (seeded with the Manic campaign, ThreatFabric
  2026-08). 456 IOC indicators across 31 families approved as a batch:
  Manic (6 APK hashes + 6 OEM-disguise package names), BADBOX/BADBOX 2.0,
  MoYu Group/zhima/tigertv, Vo1d, Mzmess, Triada, MarkiRAT, ToxicPanda and
  more. 25 validator-stage intra-batch duplicates dropped pre-HitL (not
  counted here). Complementarity strict mode PASS (mvt/threatfox
  parser-limited skips covered by the workflow's manual MVT STIX traversal:
  0 redundant vs 6525 domains + 568 packages on-device). Two rule
  candidates from this run remain in HitL and will be ledgered when
  decided: androdr-244 — SHIPPED as androdr-094 at critical (see its entry above) —
  and androdr-294 — re-authored and SHIPPED as androdr-095 on the #136 Phase 2 rules branch (see its entry above). Recurring-class candidates for
  authoring-lessons curation: BOTH rule candidates ignored the allocated
  next_id (androdr-094) and invented out-of-sequence IDs (244, 294) —
  id_allocation gate needed in the validator; and the author consulted
  validation/android-permissions.txt rather than the app's emitted-field
  reality — emitter-surface cross-check needed (tracked in AndroDR).
