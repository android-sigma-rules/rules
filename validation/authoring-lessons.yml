# Curated judgment guidance for the AndroDR AI rule pipeline.
# Injected verbatim into Rule Author AND Validator/Reviewer prompts.
# HARD CAP: 20 lessons. Additions/removals go through the pipeline's
# human-in-the-loop gate (proposed by the dispatcher from run-ledger
# rejection reasons, approved by the human).
# Each lesson: class (failure_class taxonomy from pipeline-runs/README.md)
# + guidance (one short paragraph, imperative voice).

lessons:
  - class: severity_judgment
    guidance: >
      Rules with top-level category device_posture are clamped to medium at
      runtime by SeverityCapPolicy. Never declare high/critical on a posture
      rule; convey urgency through the title and remediation text instead
      (cf. androdr-048..052).
  - class: category_choice
    guidance: >
      The IOC category enum has no TROJAN. Label banking trojans and RATs
      as MALWARE; surveillance-ware as SPYWARE or NATION_STATE_SPYWARE.
      Never invent enum values — validate-ioc-data.py rejects them.
  - class: duplicate_semantics
    guidance: >
      A posture rule keying on a single actively-exploited CVE duplicates
      androdr-047 (CISA KEV-sourced). Only named-campaign CVE sets with a
      threat-specific title justify a dedicated rule.
  - class: duplicate_semantics
    guidance: >
      Generic IOC-lookup alerts already carry family/category attribution
      from the matched ioc-data entry (IndicatorResolver). A dedicated
      named-threat rule duplicating ioc-data indicators is only justified
      when it changes detection coverage (e.g. zone matching beyond listed
      IOCs) or materially changes remediation guidance — attribution alone
      is not a reason (cf. androdr-085/086 rejections, 2026-06-12 run).
  - class: fp_risk
    guidance: >
      When a rule gates filter_known_good on from_trusted_store: true (the
      impersonation-safe pattern from androdr-089/091), the known-good
      exemption can never fire for a sideloaded selection — is_sideloaded is
      defined as not from_trusted_store, so the guard is an impersonation
      backstop, not a noise filter. Do NOT copy the "suppresses popular apps
      only" falsepositives wording from rules that lack the gate (069/087);
      state instead that every matching sideloaded app fires and needs user
      judgement.
  - class: unverifiable_provenance
    guidance: >
      Every IOC entry needs a reference that actually lists it (Gate 2b checks).
      A `source` id alone is not provenance: in 2026 about 290 invented entries
      carried plausible back-filled source labels. Never invent an indicator,
      including in examples or placeholders.
  - class: fp_risk
    guidance: >
      Every c2-domains.yml entry fires androdr-003, a critical "DNS query to
      known C2 domain" finding, whatever the entry's own severity. List only
      infrastructure the threat actor controls. Never add ad-tech, tracking,
      CDN or shared-hosting domains that ordinary users reach, and never widen
      a `*.domain` wildcard to a shared-hosting or public-suffix parent.
  - class: fp_risk
    guidance: >
      Add no ioc-data entries and no rules for the AdFection campaign
      (Citizen Lab, 2026-10-15: Candiru delivered through Discover-Tech ads),
      including the Candiru servers the report names. Indicators are useless
      here: it targets one advertising ID at a time and its infrastructure
      rotates every few days. Only TTPs would work, and AndroDR cannot see
      those signals until a later roadmap era grants the permissions, so the
      owner parked it (2026-10-17). Ad blocking and deleting the advertising
      ID fully mitigate it.
