# Rules permitted to reference judgment-kind fields during the strangler-fig
# parallel run (#136 R1, spec B5). The TOP-LEVEL KEYS are the authoritative
# frozen judgment-field set (taxonomy kind:judgment must equal them — both
# validators assert it). Entries may only be REMOVED (Phase 2 empties
# from_trusted_store.delivered; Phase 3 deletes whole keys). delivered vs
# staging are separate lists: a staging twin never authorizes its delivered id.
allowed:
  from_trusted_store:
    # Phase 2 complete: every DELIVERED rule migrated to
    # installer|ioc_lookup: trusted_installer_db, so no delivered rule may
    # reference from_trusted_store any more (closes the door on a new one
    # silently reusing it). Staging twins 069/091 still carry it and migrate
    # before Phase 3 deletes the emitted boolean.
    delivered: []
    staging: [androdr-069, androdr-091]
  is_sideloaded:
    delivered: [androdr-067, androdr-077, androdr-087, androdr-088, androdr-089]
    staging: [androdr-077, androdr-087, androdr-088, androdr-091]
  is_known_oem_app:
    delivered: [androdr-010, androdr-011, androdr-012, androdr-013, androdr-014, androdr-015, androdr-016, androdr-017, androdr-068, androdr-069]
    staging: []
