# Logsource Field Taxonomy — AndroDR SIGMA Rule Engine
#
# Authoritative reference for which fields each logsource service provides.
# Field names are the map keys from toFieldMap() — or, for field_map: none
# services, the literal field names the engine matches — NOT Kotlin property
# names. The Rule Author skill uses this to constrain detection block fields.
# LogsourceTaxonomyCrossCheckTest.kt validates this matches the Kotlin runtime.
#
# SAFE ORDERING (AndroDR #268): this file is the TRUST ROOT of the
# validate-rule.py field lint — an edit merged straight to main is live for
# remote-fetched rule validation within 12h with NO AndroDR gate having seen
# it. Taxonomy edits therefore follow the same submodule-bump-first ordering
# as rule edits (see AndroDR CLAUDE.md, "Safe ordering"): branch here, bump
# the AndroDR submodule to the branch commit, get AndroDR CI green
# (LogsourceTaxonomyCrossCheckTest + DetectionFieldCrossCheckTest), and only
# then merge to main. This includes flipping a service's status
# (e.g. unwired -> active). rules.sha256 regen does NOT apply to this file
# (it is not listed in rules.txt).

product: androdr

services:
  # ── Member-function toFieldMap() (data model classes) ──────────────

  app_scanner:
    model_class: AppTelemetry
    field_map: member
    status: active
    fields:
      package_name: { kind: raw_fact, type: string, description: "Android package name (e.g., com.example.app)" }
      app_name: { kind: raw_fact, type: string, description: "User-visible app label" }
      cert_hash: { kind: raw_fact, type: string, nullable: true, description: "SHA-256 of signing certificate" }
      cert_hash_sha1: { kind: raw_fact, type: string, nullable: true, description: "SHA-1 of signing certificate — required to match community feeds (stalkerware-indicators, MVT) that index cert IOCs by SHA-1, per the Android ecosystem convention (apksigner --print-certs)" }
      apk_hash: { kind: raw_fact, type: string, nullable: true, description: "SHA-256 of APK file" }
      is_system_app: { kind: raw_fact, type: boolean, description: "True if app is in /system partition" }
      from_trusted_store: { kind: judgment, type: boolean, description: "True if installed from Play Store or other trusted source" }
      installer: { kind: raw_fact, type: string, nullable: true, description: "Package name of the installer (e.g., com.android.vending)" }
      is_sideloaded: { kind: judgment, type: boolean, description: "True if installed outside trusted stores" }
      is_known_oem_app: { kind: judgment, type: boolean, description: "True if package matches known OEM prefix list" }
      permissions: { kind: raw_fact, type: list, description: "List of declared Android permissions" }
      requested_permissions: { kind: raw_fact, type: list, description: "EVERY permission the app requests, verbatim fully-qualified names, zero curation (emitter-emits-all-facts). Prefer this over the frozen curated short-name subset in `permissions` for new rules. MATCHING DISCIPLINE: exact element-wise equals ONLY — never |contains/|startswith (android.permission.NFC is a substring of android.permission.NFC_TRANSACTION_EVENT; substring matching WILL false-positive). Emitted by app builds after AndroDR #317; on older builds a rule keying on this field silently no-ops via the fail-closed unknown-field floor (vc610+), so shipping such rules to main is fleet-safe." }
      surveillance_permission_count: { kind: raw_fact, type: int, description: "Count of surveillance-related permissions (camera, mic, location, SMS, etc.)" }
      has_accessibility_service: { kind: raw_fact, type: boolean, description: "True if app declares an accessibility service" }
      has_device_admin: { kind: raw_fact, type: boolean, description: "True if app declares a device admin receiver" }
      known_app_category: { kind: raw_fact, type: string, nullable: true, description: "Category from known-good apps DB (e.g., SOCIAL, PRODUCTIVITY)" }
      service_permissions: { kind: raw_fact, type: list, description: "Permissions declared on exported services" }
      receiver_permissions: { kind: raw_fact, type: list, description: "Permissions declared on broadcast receivers" }
      has_launcher_activity: { kind: raw_fact, type: boolean, description: "True if app has a launcher-visible activity" }
      first_install_time: { kind: raw_fact, type: long, description: "Epoch ms of first install (0 = unknown)" }
      last_update_time: { kind: raw_fact, type: long, description: "Epoch ms of last update (0 = unknown)" }
      embedded_component_class: { kind: raw_fact, type: list, description: "Class names from manifest services/receivers/activities/providers; deduplicated; capped per app. Used by embedded-SDK fingerprinting rules (AndroDR #168)." }
      embedded_native_lib: { kind: raw_fact, type: list, description: "Filenames of lib/*/*.so entries inside the APK, ABI prefix stripped; deduplicated; capped per app. Used by embedded-SDK fingerprinting rules (AndroDR #168)." }
      webapk_scope: { kind: raw_fact, type: string, nullable: true, description: "WebAPK web scope URL from shell-manifest meta-data org.chromium.webapk.shell_apk.scope. Null for packages WITHOUT the org.chromium.webapk prefix. ATTACKER-CONTROLLED: any app may adopt that prefix and self-declare this value, so it is NOT proof of a genuine mint — treat like app_name, never as trust (AndroDR #299)" }

  device_auditor:
    model_class: DeviceTelemetry
    field_map: member
    status: active
    fields:
      check_id: { kind: raw_fact, type: string, description: "Identifier for the specific device check" }
      is_triggered: { kind: raw_fact, type: boolean, description: "True if the check found an issue" }
      adb_enabled: { kind: raw_fact, type: boolean, description: "USB debugging enabled" }
      dev_options_enabled: { kind: raw_fact, type: boolean, description: "Developer options enabled" }
      unknown_sources_enabled: { kind: raw_fact, type: boolean, description: "Install from unknown sources enabled" }
      screen_lock_enabled: { kind: raw_fact, type: boolean, description: "Screen lock is configured" }
      patch_level: { kind: raw_fact, type: string, description: "Android security patch level (YYYY-MM-DD)" }
      patch_age_days: { kind: raw_fact, type: int, description: "Days since last security patch" }
      bootloader_unlocked: { kind: raw_fact, type: boolean, description: "Bootloader is unlocked" }
      wifi_adb_enabled: { kind: raw_fact, type: boolean, description: "Wireless ADB debugging enabled" }
      unpatched_cve_count: { kind: raw_fact, type: int, description: "Number of unpatched CVEs for this patch level" }
      unpatched_cves: { kind: raw_fact, type: list, description: "List of CveEntity objects" }
      unpatched_cve_id: { kind: raw_fact, type: string, description: "Comma-joined CVE IDs (derived field, not a constructor param)" }

  dns_monitor:
    model_class: DnsEvent
    field_map: member
    status: active
    fields:
      domain: { kind: raw_fact, type: string, description: "Queried domain name" }
      app_uid: { kind: raw_fact, type: int, description: "UID of the app that made the DNS query" }
      source_package: { kind: raw_fact, type: string, nullable: true, description: "Package name of querying app (key differs from property appName)" }
      is_blocked: { kind: raw_fact, type: boolean, description: "True if DNS response was replaced with NXDOMAIN" }
      reason: { kind: raw_fact, type: string, nullable: true, description: "Reason for blocking (blocklist match, etc.)" }

  process_monitor:
    model_class: ProcessTelemetry
    field_map: member
    status: active
    fields:
      process_name: { kind: raw_fact, type: string, description: "Process name from /proc" }
      process_uid: { kind: raw_fact, type: int, description: "Linux UID of the process" }
      package_name: { kind: raw_fact, type: string, nullable: true, description: "Android package name if resolvable" }
      is_foreground: { kind: raw_fact, type: boolean, description: "True if process is in foreground" }

  file_scanner:
    model_class: FileArtifactTelemetry
    field_map: member
    status: active
    fields:
      file_path: { kind: raw_fact, type: string, description: "Absolute path to the file" }
      file_exists: { kind: raw_fact, type: boolean, description: "True if the file exists at scan time" }
      file_size: { kind: raw_fact, type: long, nullable: true, description: "File size in bytes" }
      file_modified: { kind: raw_fact, type: long, nullable: true, description: "Last modified timestamp (epoch ms)" }

  receiver_audit:
    model_class: ReceiverTelemetry
    field_map: member
    status: active
    fields:
      package_name: { kind: raw_fact, type: string, description: "Package declaring the receiver" }
      intent_action: { kind: raw_fact, type: string, description: "Intent action the receiver listens for" }
      component_name: { kind: raw_fact, type: string, description: "Fully qualified receiver class name" }
      is_system_app: { kind: raw_fact, type: boolean, description: "True if declaring app is a system app" }

  accessibility_audit:
    model_class: AccessibilityTelemetry
    field_map: member
    status: active
    fields:
      package_name: { kind: raw_fact, type: string, description: "Package declaring the accessibility service" }
      service_name: { kind: raw_fact, type: string, description: "Fully qualified service class name" }
      is_system_app: { kind: raw_fact, type: boolean, description: "True if declaring app is a system app" }
      is_enabled: { kind: raw_fact, type: boolean, description: "True if the service is currently enabled" }

  appops_audit:
    model_class: AppOpsTelemetry
    field_map: member
    status: active
    fields:
      package_name: { kind: raw_fact, type: string, description: "Package the operation belongs to" }
      operation: { kind: raw_fact, type: string, description: "AppOps operation name (e.g., android:camera)" }
      last_access_time: { kind: raw_fact, type: long, description: "Epoch ms of last access" }
      last_reject_time: { kind: raw_fact, type: long, description: "Epoch ms of last rejection" }
      access_count: { kind: raw_fact, type: int, description: "Total access count" }
      is_system_app: { kind: raw_fact, type: boolean, description: "True if app is a system app" }

  network_monitor:
    model_class: NetworkTelemetry
    field_map: member
    status: unwired  # toFieldMap() exists but NO evaluate method in SigmaRuleEngine — rules cannot fire
    fields:
      destination_ip: { kind: raw_fact, type: string, description: "Destination IP address" }
      destination_port: { kind: raw_fact, type: int, description: "Destination port number" }
      protocol: { kind: raw_fact, type: string, description: "Protocol (TCP/UDP)" }
      app_uid: { kind: raw_fact, type: int, description: "UID of the app making the connection" }
      app_name: { kind: raw_fact, type: string, nullable: true, description: "Package name of the connecting app" }
      timestamp: { kind: raw_fact, type: long, description: "Connection timestamp (epoch ms)" }

  # ── Extension-function toFieldMap() (TelemetryFieldMaps.kt) ────────

  tombstone_parser:
    model_class: TombstoneEvent
    field_map: extension  # internal fun TombstoneEvent.toFieldMap() in com.androdr.sigma
    status: active
    fields:
      process_name: { kind: raw_fact, type: string, description: "Crashed process name" }
      package_name: { kind: raw_fact, type: string, nullable: true, description: "Package name if resolvable" }
      signal_number: { kind: raw_fact, type: int, nullable: true, description: "Signal that caused the crash" }
      abort_message: { kind: raw_fact, type: string, nullable: true, description: "Abort message from the crash" }
      crash_timestamp: { kind: raw_fact, type: long, description: "When the crash occurred (epoch ms)" }
      source: { kind: raw_fact, type: string, description: "TelemetrySource enum name (LIVE_SCAN or BUGREPORT_IMPORT)" }
      captured_at: { kind: raw_fact, type: long, description: "When this telemetry was captured (epoch ms)" }

  wakelock_parser:
    model_class: WakelockAcquisition
    field_map: extension
    status: active
    fields:
      package_name: { kind: raw_fact, type: string, description: "Package holding the wakelock" }
      wakelock_tag: { kind: raw_fact, type: string, description: "Wakelock tag string" }
      acquired_at: { kind: raw_fact, type: long, description: "When the wakelock was acquired (epoch ms)" }
      duration_millis: { kind: raw_fact, type: long, nullable: true, description: "How long the wakelock was held" }
      source: { kind: raw_fact, type: string, description: "TelemetrySource enum name" }
      captured_at: { kind: raw_fact, type: long, description: "When this telemetry was captured (epoch ms)" }

  battery_daily:
    model_class: BatteryDailyEvent
    field_map: extension
    status: active
    fields:
      day_index: { kind: raw_fact, type: int, description: "Day offset in the battery stats history" }
      event_type: { kind: raw_fact, type: string, description: "Battery event type" }
      package_name: { kind: raw_fact, type: string, nullable: true, description: "Package associated with the event" }
      description: { kind: raw_fact, type: string, description: "Human-readable event description" }
      source: { kind: raw_fact, type: string, description: "TelemetrySource enum name" }
      captured_at: { kind: raw_fact, type: long, description: "When this telemetry was captured (epoch ms)" }

  package_install_history:
    model_class: PackageInstallHistoryEntry
    field_map: extension
    status: active
    fields:
      package_name: { kind: raw_fact, type: string, description: "Installed/updated/uninstalled package name" }
      event_type: { kind: raw_fact, type: string, description: "INSTALL, UNINSTALL, or UPDATE" }
      timestamp: { kind: raw_fact, type: long, description: "When the event occurred (epoch ms)" }
      version_code: { kind: raw_fact, type: long, nullable: true, description: "Version code at time of event" }
      source: { kind: raw_fact, type: string, description: "TelemetrySource enum name" }
      captured_at: { kind: raw_fact, type: long, description: "When this telemetry was captured (epoch ms)" }

  platform_compat:
    model_class: PlatformCompatChange
    field_map: extension
    status: active
    fields:
      change_id: { kind: raw_fact, type: string, description: "Platform compatibility change ID" }
      package_name: { kind: raw_fact, type: string, description: "Package affected by the change" }
      enabled: { kind: raw_fact, type: boolean, description: "Whether the compat change is enabled" }
      source: { kind: raw_fact, type: string, description: "TelemetrySource enum name" }
      captured_at: { kind: raw_fact, type: long, description: "When this telemetry was captured (epoch ms)" }

  db_info:
    model_class: DatabasePathObservation
    field_map: extension
    status: active
    fields:
      file_path: { kind: raw_fact, type: string, description: "Absolute path to the database file" }
      process_name: { kind: raw_fact, type: string, nullable: true, description: "Process that owns the database" }
      package_name: { kind: raw_fact, type: string, nullable: true, description: "Package that owns the database" }
      observation_timestamp: { kind: raw_fact, type: long, description: "When the database was observed (epoch ms)" }
      source: { kind: raw_fact, type: string, description: "TelemetrySource enum name" }
      captured_at: { kind: raw_fact, type: long, description: "When this telemetry was captured (epoch ms)" }

  # ── No toFieldMap() (engine-matched literal fields) ────────────────

  timeline:
    model_class: ForensicTimelineEvent
    field_map: none  # no toFieldMap(); SigmaRuleEngine.computeAtomBindings matches the literal field below
    status: active
    fields:
      category: { kind: raw_fact, type: string, description: "Timeline event category an atom rule binds to (e.g. app_foreground, package_install, dns_match). BINDING PRECONDITIONS (SigmaRuleEngine.computeAtomBindings / extractAtomCategory): matched by EXACT EQUALITY only; the atom must be enabled and level: informational; the detection selection must be literally named 'selection'; only the FIRST value of the matcher binds. An atom violating name/level/enabled NEVER binds; a |modifier on this field is silently IGNORED — the atom still binds by exact equality on the first value (dead only if that value is not an exact category literal, silently wrong-semantics otherwise)." }
