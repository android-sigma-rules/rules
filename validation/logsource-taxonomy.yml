# Logsource Field Taxonomy — AndroDR SIGMA Rule Engine
#
# Authoritative reference for which fields each logsource service provides.
# Field names are the map keys from toFieldMap() — or, for field_map: none
# services, the literal field names the engine matches — NOT Kotlin property
# names. The Rule Author skill uses this to constrain detection block fields.
# LogsourceTaxonomyCrossCheckTest.kt validates this matches the Kotlin runtime.
#
# Service-level metadata (telemetry store, spec §4.2; validate-rule.py checks
# that every reference resolves to one of the service's own fields):
#   status:               active | emitter_only | unwired. emitter_only =
#                         records are produced and stored but NO rule may
#                         target the service.
#   event_time_field:     field holding the event's epoch-ms time (events only;
#                         absent for snapshot services such as db_info).
#   time_precision_field: field stating the precision of event_time_field.
#   key_fields:           fields identifying a snapshot record across scans.
#   package_field:        field naming the owning package.
# Field-level flags: positive_only: true marks a field old binaries never emit
# (a matcher on it is false there, so `not` over-fires); optional: true marks a
# field only some producers set and implies positive_only. validate-rule.py
# rejects either under `not`.
#
# SAFE ORDERING (AndroDR #268): this file is the TRUST ROOT of the
# validate-rule.py field lint — an edit merged straight to main is live for
# remote-fetched rule validation within 12h with NO AndroDR gate having seen
# it. Taxonomy edits therefore follow the same submodule-bump-first ordering
# as rule edits (see AndroDR CLAUDE.md, "Safe ordering"): branch here, bump
# the AndroDR submodule to the branch commit, get AndroDR CI green
# (LogsourceTaxonomyCrossCheckTest + DetectionFieldCrossCheckTest), and only
# then merge to main. This includes flipping a service's status
# (e.g. unwired -> active). rules.sha256 regen does NOT apply to this file
# (it is not listed in rules.txt).

product: androdr

services:
  # ── Member-function toFieldMap() (data model classes) ──────────────

  app_scanner:
    model_class: AppTelemetry
    field_map: member
    status: active
    key_fields: [package_name]
    package_field: package_name
    fields:
      package_name: { kind: raw_fact, type: string, description: "Android package name (e.g., com.example.app)" }
      app_name: { kind: raw_fact, type: string, description: "User-visible app label" }
      cert_hash: { kind: raw_fact, type: string, nullable: true, description: "SHA-256 of signing certificate" }
      cert_hash_sha1: { kind: raw_fact, type: string, nullable: true, description: "SHA-1 of signing certificate — required to match community feeds (stalkerware-indicators, MVT) that index cert IOCs by SHA-1, per the Android ecosystem convention (apksigner --print-certs)" }
      apk_hash: { kind: raw_fact, type: string, nullable: true, description: "SHA-256 of APK file" }
      is_system_app: { kind: raw_fact, type: boolean, description: "True if app is in /system partition" }
      from_trusted_store: { kind: judgment, type: boolean, description: "True if installed from Play Store or other trusted source" }
      installer: { kind: raw_fact, type: string, nullable: true, description: "Package name of the installer (e.g., com.android.vending)" }
      is_sideloaded: { kind: judgment, type: boolean, description: "True if installed outside trusted stores" }
      is_known_oem_app: { kind: judgment, type: boolean, description: "True if package matches known OEM prefix list" }
      permissions: { kind: raw_fact, type: list, description: "Curated security-relevant SHORT-NAME subset (surveillance + high-risk sets from AppScanner.EXPOSED_PERMISSION_SHORT_NAMES) — NOT the full requested list. FROZEN compat surface for shipped fleet rules; new rules match requested_permissions instead" }
      requested_permissions: { kind: raw_fact, type: list, description: "EVERY permission the app requests, verbatim fully-qualified names, zero curation (emitter-emits-all-facts). Prefer this over the frozen curated short-name subset in `permissions` for new rules. MATCHING DISCIPLINE (validate-rule.py enforces): exact element-wise equals ONLY — bare key or |all combiner, never |contains/|startswith (android.permission.NFC is a substring of android.permission.NFC_TRANSACTION_EVENT; substring matching WILL false-positive). FLEET SAFETY — POSITIVE REFERENCES ONLY: emitted by app builds after AndroDR #317; older builds have NO unknown-field skip floor — a matcher on the missing field evaluates false, which no-ops positive selections but INVERTS under `not`, over-firing the old fleet. Never reference this field in a negated filter until the fleet floor covers the emitter (validate-rule.py rejects it)", positive_only: true }
      surveillance_permission_count: { kind: raw_fact, type: int, description: "Count of surveillance-related permissions (camera, mic, location, SMS, etc.)" }
      has_accessibility_service: { kind: raw_fact, type: boolean, description: "True if app declares an accessibility service" }
      has_device_admin: { kind: raw_fact, type: boolean, description: "True if app declares a device admin receiver" }
      has_boot_receiver: { kind: raw_fact, type: boolean, description: "True if the app has a receiver registered for BOOT_COMPLETED or LOCKED_BOOT_COMPLETED (via queryBroadcastReceivers). FLEET SAFETY — POSITIVE REFERENCES ONLY: emitted by app builds after AndroDR #331; on older builds a matcher on this field evaluates false, which no-ops positive selections but INVERTS under `not`, over-firing the old fleet. Never reference this field in a negated filter until the fleet floor covers the emitter (AndroDR #331)", positive_only: true }
      known_app_category: { kind: raw_fact, type: string, nullable: true, description: "Category from known-good apps DB (e.g., SOCIAL, PRODUCTIVITY)" }
      service_permissions: { kind: raw_fact, type: list, description: "Permissions declared on exported services" }
      receiver_permissions: { kind: raw_fact, type: list, description: "Permissions declared on broadcast receivers" }
      has_launcher_activity: { kind: raw_fact, type: boolean, description: "True if app has a launcher-visible activity" }
      first_install_time: { kind: raw_fact, type: long, description: "Epoch ms of first install (0 = unknown)" }
      last_update_time: { kind: raw_fact, type: long, description: "Epoch ms of last update (0 = unknown)" }
      embedded_component_class: { kind: raw_fact, type: list, description: "Class names from manifest services/receivers/activities/providers; deduplicated; capped per app. Used by embedded-SDK fingerprinting rules (AndroDR #168)." }
      embedded_native_lib: { kind: raw_fact, type: list, description: "Filenames of lib/*/*.so entries inside the APK, ABI prefix stripped; deduplicated; capped per app. Used by embedded-SDK fingerprinting rules (AndroDR #168)." }
      webapk_scope: { kind: raw_fact, type: string, nullable: true, description: "WebAPK web scope URL from shell-manifest meta-data org.chromium.webapk.shell_apk.scope. Null for packages WITHOUT the org.chromium.webapk prefix. ATTACKER-CONTROLLED: any app may adopt that prefix and self-declare this value, so it is NOT proof of a genuine mint — treat like app_name, never as trust (AndroDR #299)" }

  device_auditor:
    model_class: DeviceTelemetry
    field_map: member
    status: active
    key_fields: [check_id]
    fields:
      check_id: { kind: raw_fact, type: string, description: "Identifier for the specific device check" }
      is_triggered: { kind: raw_fact, type: boolean, description: "True if the check found an issue" }
      adb_enabled: { kind: raw_fact, type: boolean, description: "USB debugging enabled" }
      dev_options_enabled: { kind: raw_fact, type: boolean, description: "Developer options enabled" }
      unknown_sources_enabled: { kind: raw_fact, type: boolean, description: "Install from unknown sources enabled" }
      screen_lock_enabled: { kind: raw_fact, type: boolean, description: "Screen lock is configured" }
      patch_level: { kind: raw_fact, type: string, description: "Android security patch level (YYYY-MM-DD)" }
      patch_age_days: { kind: raw_fact, type: int, description: "Days since last security patch" }
      bootloader_unlocked: { kind: raw_fact, type: boolean, description: "Bootloader is unlocked" }
      wifi_adb_enabled: { kind: raw_fact, type: boolean, description: "Wireless ADB debugging enabled" }
      unpatched_cve_count: { kind: raw_fact, type: int, description: "Number of unpatched CVEs for this patch level" }
      unpatched_cves: { kind: raw_fact, type: list, description: "List of CveEntity objects" }
      unpatched_cve_id: { kind: raw_fact, type: string, description: "Comma-joined CVE IDs (derived field, not a constructor param)" }

  dns_monitor:
    model_class: DnsEvent
    field_map: member
    status: active
    event_time_field: timestamp
    package_field: source_package
    fields:
      domain: { kind: raw_fact, type: string, description: "Queried domain name" }
      app_uid: { kind: raw_fact, type: int, description: "UID of the app that made the DNS query" }
      source_package: { kind: raw_fact, type: string, nullable: true, description: "Package name of querying app (key differs from property appName)" }
      resolved_ips: { kind: raw_fact, type: list, positive_only: true, description: "IP addresses the DNS response resolved to (strings). Absent when the query was blocked or unanswered. Emitted by app builds after the telemetry-store change; older binaries never set it. FLEET SAFETY — POSITIVE REFERENCES ONLY: old builds never emit this field, so a matcher on it evaluates false there, which no-ops positive selections but INVERTS under `not`, over-firing the old fleet. Never reference it in a negated filter until the fleet floor covers the emitter (validate-rule.py rejects it)" }
      is_blocked: { kind: raw_fact, type: boolean, optional: true, description: "True if the tunnel replaced the DNS response with NXDOMAIN. Set only on live tunnel records; imported DNS records (intrusion-log and bug-report imports) omit it, because AndroDR was not in the path and a default would read as a verdict that never happened. OPTIONAL: only some producers set it, and optional implies positive-only. FLEET SAFETY — POSITIVE REFERENCES ONLY: imported records never carry this field, so a matcher on it evaluates false there, which no-ops positive selections but INVERTS under `not`, over-firing the old fleet. Never reference it in a negated filter until the fleet floor covers the emitter (validate-rule.py rejects it)" }
      reason: { kind: raw_fact, type: string, nullable: true, optional: true, description: "Reason the tunnel gave for blocking or flagging the query (blocklist match, IOC match, etc.); null on a live record means the tunnel had no match when the domain was queried. Set only on live tunnel records; imported DNS records omit it, because AndroDR was not in the path. OPTIONAL: only some producers set it, and optional implies positive-only. FLEET SAFETY — POSITIVE REFERENCES ONLY: imported records never carry this field, so a matcher on it evaluates false there, which no-ops positive selections but INVERTS under `not`, over-firing the old fleet. Never reference it in a negated filter until the fleet floor covers the emitter (validate-rule.py rejects it)" }
      timestamp: { kind: raw_fact, type: long, description: "When the query was observed (epoch ms). Emitted only by app builds newer than 0.9.0.656 (the last release without it); older binaries never set it. FLEET SAFETY — POSITIVE REFERENCES ONLY: on builds up to 0.9.0.656 a matcher on this field evaluates false, which no-ops positive selections but INVERTS under `not`, over-firing the old fleet. Never reference this field in a negated filter until the fleet floor covers the emitter (validate-rule.py rejects it)", positive_only: true }

  process_monitor:
    model_class: ProcessTelemetry
    field_map: member
    status: active
    key_fields: [process_uid, process_name]
    package_field: package_name
    fields:
      process_name: { kind: raw_fact, type: string, description: "Process name from /proc" }
      process_uid: { kind: raw_fact, type: int, description: "Linux UID of the process" }
      package_name: { kind: raw_fact, type: string, nullable: true, description: "Android package name if resolvable" }
      is_foreground: { kind: raw_fact, type: boolean, description: "True if process is in foreground" }

  file_scanner:
    model_class: FileArtifactTelemetry
    field_map: member
    status: active
    key_fields: [file_path]
    fields:
      file_path: { kind: raw_fact, type: string, description: "Absolute path to the file" }
      file_exists: { kind: raw_fact, type: boolean, description: "True if the file exists at scan time" }
      file_size: { kind: raw_fact, type: long, nullable: true, description: "File size in bytes" }
      file_modified: { kind: raw_fact, type: long, nullable: true, description: "Last modified timestamp (epoch ms)" }
      accessible: { kind: raw_fact, type: boolean, positive_only: true, description: "True when the scanner could stat the path (distinguishes absent from unreadable). Emitted by app builds after the telemetry-store change. FLEET SAFETY — POSITIVE REFERENCES ONLY: old builds never emit this field, so a matcher on it evaluates false there, which no-ops positive selections but INVERTS under `not`, over-firing the old fleet. Never reference it in a negated filter until the fleet floor covers the emitter (validate-rule.py rejects it)" }

  receiver_audit:
    model_class: ReceiverTelemetry
    field_map: member
    status: active
    key_fields: [package_name, component_name, intent_action]
    package_field: package_name
    fields:
      package_name: { kind: raw_fact, type: string, description: "Package declaring the receiver" }
      intent_action: { kind: raw_fact, type: string, description: "Intent action the receiver listens for" }
      component_name: { kind: raw_fact, type: string, description: "Fully qualified receiver class name" }
      is_system_app: { kind: raw_fact, type: boolean, description: "True if declaring app is a system app" }

  accessibility_audit:
    model_class: AccessibilityTelemetry
    field_map: member
    status: active
    key_fields: [package_name, service_name]
    package_field: package_name
    fields:
      package_name: { kind: raw_fact, type: string, description: "Package declaring the accessibility service" }
      service_name: { kind: raw_fact, type: string, description: "Fully qualified service class name" }
      is_system_app: { kind: raw_fact, type: boolean, description: "True if declaring app is a system app" }
      is_enabled: { kind: raw_fact, type: boolean, description: "True if the service is currently enabled" }

  appops_audit:
    model_class: AppOpsTelemetry
    field_map: member
    status: active
    event_time_field: event_time_ms
    key_fields: [package_name, operation]
    package_field: package_name
    fields:
      package_name: { kind: raw_fact, type: string, description: "Package the operation belongs to" }
      operation: { kind: raw_fact, type: string, description: "AppOps operation name (e.g., android:camera)" }
      last_access_time: { kind: raw_fact, type: long, description: "Epoch ms of last access" }
      last_reject_time: { kind: raw_fact, type: long, description: "Epoch ms of last rejection" }
      access_count: { kind: raw_fact, type: int, description: "Total access count" }
      is_system_app: { kind: raw_fact, type: boolean, description: "True if app is a system app" }
      event_time_ms: { kind: raw_fact, type: long, optional: true, description: "Epoch ms of the individual access event, set by the bug-report AppOps module only when the dumpsys line carries a real timestamp (0 when it does not). Live scans never set it. OPTIONAL: only some producers set it, and optional implies positive-only. FLEET SAFETY — POSITIVE REFERENCES ONLY: old builds never emit this field, so a matcher on it evaluates false there, which no-ops positive selections but INVERTS under `not`, over-firing the old fleet. Never reference it in a negated filter until the fleet floor covers the emitter (validate-rule.py rejects it)" }

  network_monitor:
    model_class: NetworkTelemetry
    field_map: member
    status: active
    event_time_field: timestamp
    package_field: app_name
    fields:
      destination_ip: { kind: raw_fact, type: string, description: "Destination IP address" }
      destination_port: { kind: raw_fact, type: int, description: "Destination port number" }
      protocol: { kind: raw_fact, type: string, nullable: true, description: "Protocol (TCP/UDP); null for Intrusion Logging imports, where the source genuinely does not record it" }
      app_uid: { kind: raw_fact, type: int, description: "UID of the app making the connection (-1 if unresolvable)" }
      app_name: { kind: raw_fact, type: string, nullable: true, description: "Package name of the connecting app (hint, not identity — shared-UID components smear)" }
      timestamp: { kind: raw_fact, type: long, description: "Connection timestamp (epoch ms)" }
      source: { kind: raw_fact, type: string, description: "TelemetrySource enum name (INTRUSION_LOG_IMPORT for imported logs)" }
      captured_at: { kind: raw_fact, type: long, description: "When this telemetry was captured/imported (epoch ms)" }

  # ── Extension-function toFieldMap() (TelemetryFieldMaps.kt) ────────

  tombstone_parser:
    model_class: TombstoneEvent
    field_map: extension  # internal fun TombstoneEvent.toFieldMap() in com.androdr.sigma
    status: active
    event_time_field: crash_timestamp
    package_field: package_name
    fields:
      process_name: { kind: raw_fact, type: string, description: "Crashed process name" }
      package_name: { kind: raw_fact, type: string, nullable: true, description: "Package name if resolvable" }
      signal_number: { kind: raw_fact, type: int, nullable: true, description: "Signal that caused the crash" }
      abort_message: { kind: raw_fact, type: string, nullable: true, description: "Abort message from the crash" }
      crash_timestamp: { kind: raw_fact, type: long, description: "When the crash occurred (epoch ms)" }
      source: { kind: raw_fact, type: string, description: "TelemetrySource enum name (LIVE_SCAN or BUGREPORT_IMPORT)" }
      captured_at: { kind: raw_fact, type: long, description: "When this telemetry was captured (epoch ms)" }

  wakelock_parser:
    model_class: WakelockAcquisition
    field_map: extension
    status: active
    event_time_field: acquired_at
    package_field: package_name
    fields:
      package_name: { kind: raw_fact, type: string, description: "Package holding the wakelock" }
      wakelock_tag: { kind: raw_fact, type: string, description: "Wakelock tag string" }
      acquired_at: { kind: raw_fact, type: long, description: "When the wakelock was acquired (epoch ms)" }
      duration_millis: { kind: raw_fact, type: long, nullable: true, description: "How long the wakelock was held" }
      source: { kind: raw_fact, type: string, description: "TelemetrySource enum name" }
      captured_at: { kind: raw_fact, type: long, description: "When this telemetry was captured (epoch ms)" }

  battery_daily:
    model_class: BatteryDailyEvent
    field_map: extension
    status: active
    event_time_field: timestamp
    time_precision_field: timestamp_precision
    package_field: package_name
    fields:
      day_index: { kind: raw_fact, type: int, description: "Day offset in the battery stats history" }
      version: { kind: raw_fact, type: long, positive_only: true, description: "Package version code parsed from the battery-stats entry (0 when unparseable), carried on every typed BatteryDailyEvent. FLEET SAFETY — POSITIVE REFERENCES ONLY: old builds never emit this field, so a matcher on it evaluates false there, which no-ops positive selections but INVERTS under `not`, over-firing the old fleet. Never reference it in a negated filter until the fleet floor covers the emitter (validate-rule.py rejects it)" }
      event_type: { kind: raw_fact, type: string, description: "Battery event type" }
      package_name: { kind: raw_fact, type: string, nullable: true, description: "Package associated with the event" }
      description: { kind: raw_fact, type: string, description: "Human-readable event description" }
      timestamp: { kind: raw_fact, type: long, positive_only: true, description: "Epoch ms of the event, at day precision (see timestamp_precision). Present only when the battery-stats section yields a date. FLEET SAFETY — POSITIVE REFERENCES ONLY: old builds never emit this field, so a matcher on it evaluates false there, which no-ops positive selections but INVERTS under `not`, over-firing the old fleet. Never reference it in a negated filter until the fleet floor covers the emitter (validate-rule.py rejects it)" }
      timestamp_precision: { kind: raw_fact, type: string, positive_only: true, description: "Precision of timestamp; currently always `day`. FLEET SAFETY — POSITIVE REFERENCES ONLY: old builds never emit this field, so a matcher on it evaluates false there, which no-ops positive selections but INVERTS under `not`, over-firing the old fleet. Never reference it in a negated filter until the fleet floor covers the emitter (validate-rule.py rejects it)" }
      source: { kind: raw_fact, type: string, description: "TelemetrySource enum name" }
      captured_at: { kind: raw_fact, type: long, description: "When this telemetry was captured (epoch ms)" }

  package_install_history:
    model_class: PackageInstallHistoryEntry
    field_map: extension
    status: active
    event_time_field: timestamp
    package_field: package_name
    fields:
      package_name: { kind: raw_fact, type: string, description: "Installed/updated/uninstalled package name" }
      event_type: { kind: raw_fact, type: string, description: "INSTALL, UNINSTALL, or UPDATE" }
      timestamp: { kind: raw_fact, type: long, description: "When the event occurred (epoch ms)" }
      version_code: { kind: raw_fact, type: long, nullable: true, description: "Version code at time of event" }
      source: { kind: raw_fact, type: string, description: "TelemetrySource enum name" }
      captured_at: { kind: raw_fact, type: long, description: "When this telemetry was captured (epoch ms)" }

  platform_compat:
    model_class: PlatformCompatChange
    field_map: extension
    status: active
    key_fields: [package_name, change_id]
    package_field: package_name
    fields:
      change_id: { kind: raw_fact, type: string, description: "Platform compatibility change ID" }
      package_name: { kind: raw_fact, type: string, description: "Package affected by the change" }
      enabled: { kind: raw_fact, type: boolean, optional: true, description: "Whether the compat change is enabled, parsed from the `enabled=` token of the dumpsys line; omitted when the line does not state it. OPTIONAL: only some records set it, and optional implies positive-only. FLEET SAFETY — POSITIVE REFERENCES ONLY: old builds never emit this field, so a matcher on it evaluates false there, which no-ops positive selections but INVERTS under `not`, over-firing the old fleet. Never reference it in a negated filter until the fleet floor covers the emitter (validate-rule.py rejects it)" }
      source: { kind: raw_fact, type: string, description: "TelemetrySource enum name" }
      captured_at: { kind: raw_fact, type: long, description: "When this telemetry was captured (epoch ms)" }

  db_info:
    model_class: DatabasePathObservation
    field_map: extension
    status: active
    key_fields: [package_name, file_path]
    package_field: package_name
    fields:
      file_path: { kind: raw_fact, type: string, description: "Absolute path to the database file" }
      process_name: { kind: raw_fact, type: string, nullable: true, description: "Process that owns the database" }
      package_name: { kind: raw_fact, type: string, nullable: true, description: "Package that owns the database" }
      observation_timestamp: { kind: raw_fact, type: long, description: "When the database was observed (epoch ms)" }
      db_path: { kind: raw_fact, type: string, positive_only: true, description: "Database path as referenced in the bug report (typed DatabasePathObservation record). FLEET SAFETY — POSITIVE REFERENCES ONLY: old builds never emit this field, so a matcher on it evaluates false there, which no-ops positive selections but INVERTS under `not`, over-firing the old fleet. Never reference it in a negated filter until the fleet floor covers the emitter (validate-rule.py rejects it)" }
      recent_query_count: { kind: raw_fact, type: int, positive_only: true, description: "Recent query count parsed from the dbinfo section for this database. FLEET SAFETY — POSITIVE REFERENCES ONLY: old builds never emit this field, so a matcher on it evaluates false there, which no-ops positive selections but INVERTS under `not`, over-firing the old fleet. Never reference it in a negated filter until the fleet floor covers the emitter (validate-rule.py rejects it)" }
      source: { kind: raw_fact, type: string, description: "TelemetrySource enum name" }
      captured_at: { kind: raw_fact, type: long, description: "When this telemetry was captured (epoch ms)" }

  security_log:
    model_class: SecurityLogEvent
    field_map: extension  # internal fun SecurityLogEvent.toFieldMap() in com.androdr.sigma
    status: active
    event_time_field: timestamp
    fields:
      timestamp: { kind: raw_fact, type: long, description: "Event time (epoch ms)" }
      tag: { kind: raw_fact, type: int, description: "Numeric android.app.admin.SecurityLog tag" }
      tag_name: { kind: raw_fact, type: string, description: "Registry-resolved tag name (e.g. adb_shell_cmd); unknown_<tag> for unmapped tags" }
      security_data: { kind: raw_fact, type: list, description: "Tag-specific value array, emitted verbatim as strings (emitter-emits-all-facts; typed per-tag extraction deferred until real fixtures validate layouts — spec §11.1)" }
      source: { kind: raw_fact, type: string, description: "TelemetrySource enum name" }
      captured_at: { kind: raw_fact, type: long, description: "When this telemetry was captured/imported (epoch ms)" }

  # ── No toFieldMap() (engine-matched literal fields) ────────────────

  timeline:
    model_class: ForensicTimelineEvent
    field_map: none  # no toFieldMap(); SigmaRuleEngine.computeAtomBindings matches the literal field below
    status: active
    fields:
      category: { kind: raw_fact, type: string, description: "Timeline event category an atom rule binds to (e.g. app_foreground, package_install, ioc_match). BINDING PRECONDITIONS (SigmaRuleEngine.computeAtomBindings / extractAtomCategory): matched by EXACT EQUALITY only; the atom must be enabled and level: informational; the detection selection must be literally named 'selection'; only the FIRST value of the matcher binds. An atom violating name/level/enabled NEVER binds; a |modifier on this field is silently IGNORED — the atom still binds by exact equality on the first value (dead only if that value is not an exact category literal, silently wrong-semantics otherwise)." }

  # ── Emitter-only services (documented, NO rules; AndroDR telemetry store) ──
  # status: emitter_only — the producer exists and its records are stored, but
  # no rule may target the service (validate-rule.py rejects any non-active
  # service outside staging/). adb_audit / activity_audit are documented from
  # the bug-report modules' current record keys (AdbKeysModule, ActivityModule).

  usage_stats:
    model_class: UsageEvent
    field_map: member
    status: emitter_only
    event_time_field: timestamp
    package_field: package_name
    fields:
      timestamp: { kind: raw_fact, type: long, description: "When the foreground/background transition occurred (epoch ms)" }
      package_name: { kind: raw_fact, type: string, description: "Package that moved to or from the foreground" }
      app_name: { kind: raw_fact, type: string, description: "User-visible app label (falls back to the package name)" }
      event_type: { kind: raw_fact, type: string, description: "Timeline category of the transition (app_foreground or app_background)" }
      source: { kind: raw_fact, type: string, description: "TelemetrySource enum name" }
      captured_at: { kind: raw_fact, type: long, description: "When this telemetry was captured (epoch ms)" }

  system_property:
    model_class: SystemPropertySnapshot
    field_map: member
    status: emitter_only
    key_fields: [key]
    fields:
      key: { kind: raw_fact, type: string, description: "System property key (e.g. ro.boot.verifiedbootstate)" }
      value: { kind: raw_fact, type: string, description: "System property value at snapshot time" }
      source: { kind: raw_fact, type: string, description: "TelemetrySource enum name" }
      captured_at: { kind: raw_fact, type: long, description: "When this telemetry was captured (epoch ms)" }

  adb_audit:
    model_class: AdbKeysModule record
    field_map: none  # bug-report module emits a literal map; no data class
    status: emitter_only
    key_fields: [key_fragment, host]
    fields:
      key_fragment: { kind: raw_fact, type: string, description: "Truncated fragment of the trusted ADB public key" }
      host: { kind: raw_fact, type: string, description: "Host label (user@machine) recorded in the trusted-key entry" }
      source: { kind: raw_fact, type: string, description: "Record provenance (adb_trusted_key)" }

  activity_audit:
    model_class: ActivityModule record
    field_map: none  # bug-report module emits a literal map; no data class
    status: emitter_only
    key_fields: [package_name, component_name, handled_scheme]
    package_field: package_name
    fields:
      package_name: { kind: raw_fact, type: string, description: "Package declaring the activity" }
      handled_scheme: { kind: raw_fact, type: string, description: "URI scheme the activity handles (colon stripped)" }
      component_name: { kind: raw_fact, type: string, description: "Fully qualified activity component" }
      is_system_app: { kind: raw_fact, type: boolean, description: "True if the declaring app is a system app" }
      is_ioc: { kind: raw_fact, type: boolean, description: "True if the scheme matched an IOC at parse time" }
      source: { kind: raw_fact, type: string, description: "Record provenance (bugreport_import)" }
